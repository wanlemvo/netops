name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
        env:
          NETOPS_BROWSER_TESTS: '1'
      - run: python -m build
      - run: |
          python -m venv /tmp/netops-install
          /tmp/netops-install/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/netops-install/bin/python -c "from importlib.resources import files; assert files('netops.gui').joinpath('static/app.js').is_file()"
