[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-cli"
version = "0.2.0"
description = "Local-first relationship operations desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=4,<5",
    "Pillow>=11,<13",
    "markdown-it-py>=4,<5",
    "Pillow>=11,<13",
    "pydantic>=2.0",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "playwright>=1.50",
]
gui = ["pywebview>=6.2.1"]
portable = [
    "pyinstaller>=6.0",
    "pywebview>=6.2.1",
]

[project.scripts]
netops = "netops.cli:app"
netops-portable = "netops.portable:main"

[project.gui-scripts]
netops-gui = "netops.gui.server:launch_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"netops.gui" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
